name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desempaquetar actualización
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f update.tgz.b64 ]; then
            base64 -d update.tgz.b64 | tar xz
            git rm -q update.tgz.b64
            git add -A
            git commit -m "Aplicar actualización del código"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Firma
        run: |
          if [ -f release.jks.b64 ]; then
            base64 -d release.jks.b64 > release.jks
          else
            keytool -genkeypair -alias controlflow -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mateo, O=ControlFlow" -keystore release.jks -storepass controlflow -keypass controlflow -storetype PKCS12
            base64 -w 76 release.jks > release.jks.b64
            git add release.jks.b64
            git commit -m "Clave de firma de la app"
            git push
          fi
      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk ControlFlow.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Control Flow v${{ github.run_number }}
          files: ControlFlow.apk
          make_latest: true
